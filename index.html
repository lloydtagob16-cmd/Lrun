<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101812">
  <title>LRUN — Live activity</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101812;
      --panel: #19231c;
      --panel-soft: #202c23;
      --text: #f2f5ee;
      --muted: #9da99e;
      --lime: #c8f169;
      --line: rgba(255,255,255,.09);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button { font: inherit; }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .activity-select {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      color: #dce5dc;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .activity-select svg { width: 15px; height: 15px; color: var(--lime); }

    .map-wrap {
      position: relative;
      height: min(44vh, 360px);
      min-height: 255px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #d9e3d8;
      isolation: isolate;
    }

    #map { width: 100%; height: 100%; background: #dce5d8; }

    .map-status {
      position: absolute;
      z-index: 500;
      top: 13px;
      left: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: calc(100% - 26px);
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: white;
      background: rgba(16,24,18,.84);
      backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #a4ada5;
    }

    .status-dot.live { background: #ff5b50; box-shadow: 0 0 0 4px rgba(255,91,80,.15); }

    .map-tools {
      position: absolute;
      z-index: 500;
      right: 12px;
      bottom: 14px;
      display: grid;
      gap: 8px;
    }

    .map-tool {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      color: #f5f7f2;
      background: rgba(16,24,18,.88);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .map-tool svg { width: 18px; height: 18px; }
    .map-tool:active { transform: scale(.96); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      min-height: 87px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
    }

    .stat-label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .stat-value {
      font-variant-numeric: tabular-nums;
      font-size: clamp(24px, 7vw, 31px);
      line-height: 1;
      font-weight: 750;
      letter-spacing: -.055em;
    }

    .stat-unit {
      margin-left: 5px;
      color: #aab4aa;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .heading-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 65px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
    }

    .compass {
      width: 37px;
      height: 37px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(200,241,105,.24);
      border-radius: 50%;
      background: rgba(200,241,105,.08);
    }

    .compass svg {
      width: 19px;
      height: 19px;
      color: var(--lime);
      transform: rotate(var(--heading, 0deg));
      transition: transform .25s ease;
    }

    .heading-copy { flex: 1; min-width: 0; }
    .heading-title { font-size: 12px; font-weight: 750; }
    .heading-hint { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .heading-value { font-size: 12px; font-variant-numeric: tabular-nums; color: #dfe7dd; }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: auto;
    }

    .primary, .secondary {
      min-height: 56px;
      border: 0;
      border-radius: 17px;
      cursor: pointer;
      font-weight: 800;
    }

    .primary {
      color: #15200e;
      background: var(--lime);
      font-size: 15px;
      box-shadow: 0 8px 25px rgba(200,241,105,.12);
    }

    .primary:disabled { opacity: .6; cursor: wait; }
    .secondary {
      min-width: 100px;
      padding: 0 18px;
      color: #e3e9e1;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      font-size: 13px;
    }

    .secondary[hidden] { display: none; }
    .primary:active, .secondary:active { transform: scale(.985); }

    .notice {
      min-height: 15px;
      margin: -8px 3px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
    }

    .notice.error { color: #ff9a90; }
    .history {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .history[hidden] { display: none; }
    .history-title { margin: 0 0 12px; font-size: 15px; font-weight: 800; }
    .history-list { display: grid; gap: 9px; }
    .history-item {
      padding: 12px;
      border-radius: 13px;
      background: var(--panel-soft);
    }

    .history-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .history-name { overflow-wrap: anywhere; font-size: 13px; font-weight: 750; }
    .history-date { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .rename-button {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--lime);
      background: transparent;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .history-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      margin-top: 10px;
      color: #dce5dc;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .history-empty { color: var(--muted); font-size: 12px; }
    .share-dialog {
      width: min(92vw, 430px);
      max-height: 92dvh;
      padding: 14px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--text);
      background: var(--panel);
    }

    .share-dialog::backdrop { background: rgba(0,0,0,.78); backdrop-filter: blur(5px); }
    .share-preview {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 68dvh;
      margin: 0 auto;
      border-radius: 10px;
      background: #000;
    }

    .share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .share-actions button { min-height: 46px; }
    .leaflet-control-attribution { font-size: 9px !important; }
    .leaflet-control-zoom { display: none; }

    .startup-screen {
      position: fixed;
      z-index: 10000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-direction: column;
      padding: max(24px, env(safe-area-inset-top)) 24px max(30px, env(safe-area-inset-bottom));
      background-color: #fff;
      background-image: url("lrun-logo.png");
      background-position: center 42%;
      background-repeat: no-repeat;
      background-size: min(100vw, 1100px) auto;
      opacity: 1;
      visibility: visible;
      transition: opacity .45s ease, visibility .45s ease;
    }

    .startup-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .startup-content {
      width: min(100%, 440px);
      margin: auto 0 clamp(18px, 5vh, 48px);
      text-align: center;
    }

    .startup-caption {
      margin: 0 0 17px;
      color: #0c3c22;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: .2em;
    }

    .startup-progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #17462b;
      font-size: 13px;
      font-weight: 700;
    }

    .startup-percent { font-variant-numeric: tabular-nums; }

    .startup-progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5eee7;
      box-shadow: inset 0 1px 2px rgba(12, 60, 34, .09);
    }

    .startup-progress-fill {
      width: 1%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00642a, #21aa42);
      box-shadow: 0 0 12px rgba(33, 170, 66, .32);
      transition: width .1s linear;
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-screen { transition: none; }
      .startup-progress-fill { transition: none; }
    }

    .current-pin {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 3px solid white;
      border-radius: 50%;
      background: #ef554b;
      box-shadow: 0 1px 9px rgba(0,0,0,.4);
    }

    .current-pin::after {
      content: "";
      width: 0;
      height: 0;
      position: absolute;
      top: -9px;
      border-right: 6px solid transparent;
      border-bottom: 11px solid #ef554b;
      border-left: 6px solid transparent;
      transform: rotate(var(--pin-heading, 0deg));
      transform-origin: 50% 21px;
    }

    @media (max-height: 740px) {
      .app { gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); }
      .map-wrap { height: min(37vh, 300px); min-height: 210px; }
      .stat { min-height: 76px; padding: 12px 14px; }
      .heading-card { min-height: 58px; }
    }

    @media (min-width: 900px) {
      .app {
        width: min(100%, 1320px);
        padding: 32px clamp(28px, 4vw, 56px) 48px;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(340px, .85fr);
        grid-template-areas:
          "header header"
          "map stats"
          "map heading"
          "map controls"
          "map notice"
          "history history";
        align-content: start;
        align-items: stretch;
        gap: 18px 26px;
      }

      header { grid-area: header; padding-bottom: 4px; }
      .map-wrap {
        grid-area: map;
        height: min(68vh, 620px);
        min-height: 440px;
        border-radius: 24px;
      }
      .stats { grid-area: stats; gap: 12px; }
      .stat { min-height: 94px; padding: 17px 18px; }
      .heading-card { grid-area: heading; }
      .controls { grid-area: controls; margin-top: 0; }
      .notice { grid-area: notice; margin: 0; text-align: left; }
      .history { grid-area: history; margin-top: 8px; padding: 20px; }
      .history-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    }

    @media (min-width: 1400px) {
      .app { gap: 22px 32px; }
      .stat-value { font-size: 34px; }
      .history-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <section class="startup-screen" id="startupScreen" aria-label="LRUN loading" aria-live="polite">
    <div class="startup-content">
      <div class="startup-caption">GET READY TO MOVE</div>
      <div class="startup-progress-row">
        <span>Loading your run space</span>
        <span class="startup-percent" id="startupPercent">1%</span>
      </div>
      <div class="startup-progress-track" role="progressbar" aria-label="Loading LRUN" aria-valuemin="1" aria-valuemax="100" aria-valuenow="1">
        <div class="startup-progress-fill" id="startupProgress"></div>
      </div>
    </div>
  </section>
  <script>
    (() => {
      const screen = document.getElementById("startupScreen");
      const percentLabel = document.getElementById("startupPercent");
      const progressFill = document.getElementById("startupProgress");
      const progressTrack = progressFill.parentElement;
      let progress = 1;
      let pageLoaded = false;
      let dismissed = false;

      const paintProgress = () => {
        percentLabel.textContent = `${progress}%`;
        progressFill.style.width = `${progress}%`;
        progressTrack.setAttribute("aria-valuenow", String(progress));
        if (progress === 100 && pageLoaded && !dismissed) {
          dismissed = true;
          window.setTimeout(() => {
            screen.classList.add("is-hidden");
            screen.setAttribute("aria-hidden", "true");
          }, 250);
        }
      };

      window.addEventListener("load", () => { pageLoaded = true; }, { once: true });
      window.setInterval(() => {
        if (progress < (pageLoaded ? 100 : 92)) {
          progress += 1;
          paintProgress();
        }
      }, 22);
    })();
  </script>
  <main class="app">
    <header>
      <button class="activity-select" id="activityButton" type="button" aria-label="Activity type: Run. Tap to change">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13 5 2 3 3 1-2 2-1 4 3 4M11 9l-3 3-3 1m5-4 3 2-2 4-4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="4" r="2" fill="currentColor"/></svg>
        RUN
      </button>
    </header>

    <section class="map-wrap" aria-label="Live route map">
      <div id="map"></div>
      <div class="map-status"><span class="status-dot" id="statusDot"></span><span id="statusText">Ready when you are</span></div>
      <div class="map-tools">
        <button class="map-tool" id="locateButton" type="button" aria-label="Center map on current location" title="Center on me">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.3" fill="currentColor"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </section>

    <section class="stats" aria-label="Activity stats">
      <div class="stat">
        <div class="stat-label">Distance</div>
        <div class="stat-value"><span id="distance">0.00</span><span class="stat-unit">km</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="time">00:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pace</div>
        <div class="stat-value"><span id="pace">—:—</span><span class="stat-unit">/km</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">GPS accuracy</div>
        <div class="stat-value"><span id="accuracy">—</span><span class="stat-unit">m</span></div>
      </div>
    </section>

    <section class="heading-card" aria-label="Direction">
      <div class="compass" id="compass"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 2 7 19-7-4-7 4 7-19Z" fill="currentColor"/></svg></div>
      <div class="heading-copy">
        <div class="heading-title">Direction</div>
        <div class="heading-hint" id="headingHint">Start moving to find your heading</div>
      </div>
      <div class="heading-value" id="headingValue">—°</div>
    </section>

    <div class="controls">
      <button class="primary" id="startButton" type="button">Start activity</button>
      <button class="secondary" id="finishButton" type="button" hidden>Finish</button>
    </div>
    <p class="notice" id="notice" role="status">Your location stays on this device. Allow location access to track your route.</p>
    <section class="history" id="activityHistory" aria-label="Saved activities" hidden>
      <h2 class="history-title">Saved activities</h2>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>
  <dialog class="share-dialog" id="shareDialog" aria-label="Saved activity share card">
    <img class="share-preview" id="sharePreview" alt="Activity summary card with distance, pace, time and route">
    <div class="share-actions">
      <button class="primary" id="downloadCardButton" type="button">Save image</button>
      <button class="secondary" id="closeShareButton" type="button">Done</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      const route = L.polyline([], { color: "#e45045", weight: 5, opacity: .95, lineCap: "round", lineJoin: "round" }).addTo(map);
      const pinIcon = L.divIcon({ className: "", html: '<div class="current-pin"></div>', iconSize: [24, 24], iconAnchor: [12, 12] });
      let marker = null;
      let watchId = null;
      let state = "ready";
      let totalMeters = 0;
      let startedAt = 0;
      let elapsedBeforePause = 0;
      let lastPoint = null;
      let latestPosition = null;
      let timerId = null;
      let headingSource = "";
      let activityType = "RUN";
      let activityStartedAt = 0;
      let savedActivities = [];
      const storageKey = "stride.savedActivities";

      const setNotice = (message, isError) => {
        $("notice").textContent = message;
        $("notice").classList.toggle("error", Boolean(isError));
      };

      const formatTime = (seconds) => {
        const whole = Math.max(0, Math.floor(seconds));
        const hours = Math.floor(whole / 3600);
        const minutes = Math.floor((whole % 3600) / 60);
        const secs = whole % 60;
        return hours
          ? `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      };

      const formatCardTime = (seconds) => {
        const whole = Math.max(0, Math.floor(seconds));
        const hours = Math.floor(whole / 3600);
        const minutes = Math.floor((whole % 3600) / 60);
        const secs = whole % 60;
        if (hours) return `${hours}h ${minutes}m ${secs}s`;
        if (minutes) return `${minutes}m ${secs}s`;
        return `${secs}s`;
      };

      const updateStats = () => {
        const elapsed = state === "running" ? elapsedBeforePause + (Date.now() - startedAt) / 1000 : elapsedBeforePause;
        $("time").textContent = formatTime(elapsed);
        $("distance").textContent = (totalMeters / 1000).toFixed(2);
        if (totalMeters >= 10 && elapsed > 0) {
          const paceSeconds = elapsed / (totalMeters / 1000);
          $("pace").textContent = `${Math.floor(paceSeconds / 60)}:${String(Math.floor(paceSeconds % 60)).padStart(2, "0")}`;
        } else {
          $("pace").textContent = "—:—";
        }
      };

      const compassPoint = (degrees) => {
        const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
        return directions[Math.round(((degrees % 360) + 360) % 360 / 45) % 8];
      };

      const updateHeading = (degrees, source) => {
        if (!Number.isFinite(degrees)) return;
        const normalized = ((degrees % 360) + 360) % 360;
        $("headingValue").textContent = `${Math.round(normalized)}° ${compassPoint(normalized)}`;
        $("headingHint").textContent = source === "compass"
          ? "Phone compass"
          : "Direction of travel";
        $("compass").style.setProperty("--heading", `${normalized}deg`);
        const pin = document.querySelector(".current-pin");
        if (pin) pin.style.setProperty("--pin-heading", `${normalized}deg`);
        headingSource = source;
      };

      const distanceBetween = (a, b) => {
        const radians = (value) => value * Math.PI / 180;
        const lat1 = radians(a.lat);
        const lat2 = radians(b.lat);
        const dLat = lat2 - lat1;
        const dLon = radians(b.lng - a.lng);
        const value = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
        return 6371000 * 2 * Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
      };

      const showCurrentLocation = (position) => {
        const { latitude, longitude, accuracy } = position.coords;
        const current = { lat: latitude, lng: longitude };
        latestPosition = current;
        $("accuracy").textContent = Number.isFinite(accuracy) ? String(Math.round(accuracy)) : "—";
        if (!marker) marker = L.marker(current, { icon: pinIcon, keyboard: false }).addTo(map);
        else marker.setLatLng(current);
        map.setView(current, 16, { animate: true });
      };

      const updatePosition = (position) => {
        const { latitude, longitude, accuracy, heading } = position.coords;
        const current = { lat: latitude, lng: longitude };
        showCurrentLocation(position);

        if (Number.isFinite(heading) && heading >= 0) updateHeading(heading, "gps");
        else if (!headingSource) $("headingHint").textContent = "Move outdoors for direction";

        if (accuracy > 50) {
          setNotice(`GPS signal is weak (${Math.round(accuracy)} m accuracy). Move somewhere with a clearer sky view.`, false);
          return;
        }

        if (lastPoint) {
          const moved = distanceBetween(lastPoint, current);
          if (moved >= 2 && moved < 100) {
            totalMeters += moved;
            if (!Number.isFinite(heading) || heading < 0) {
              const north = Math.sin((current.lng - lastPoint.lng) * Math.PI / 180) * Math.cos(current.lat * Math.PI / 180);
              const east = Math.cos(lastPoint.lat * Math.PI / 180) * Math.sin(current.lat * Math.PI / 180) -
                Math.sin(lastPoint.lat * Math.PI / 180) * Math.cos(current.lat * Math.PI / 180) *
                Math.cos((current.lng - lastPoint.lng) * Math.PI / 180);
              updateHeading((Math.atan2(north, east) * 180 / Math.PI + 360) % 360, "gps");
            }
          }
        }
        lastPoint = current;
        route.addLatLng(current);
        updateStats();
        if (state === "running") setNotice("Tracking your activity. Keep your phone with you.", false);
      };

      const locationError = (error) => {
        const messages = {
          1: "Location permission was denied. Allow location access in your browser settings, then try again.",
          2: "Your location could not be determined. Check that GPS/location services are on and try again.",
          3: "GPS took too long to respond. Try again somewhere with a clearer sky view."
        };
        if (state !== "running") $("statusText").textContent = "Location unavailable";
        setNotice(messages[error.code] || "Could not read your location. Please try again.", true);
        if (state === "running" && error.code === 1) pauseActivity();
      };

      const startWatch = () => {
        if (!navigator.geolocation) {
          setNotice("This browser does not support GPS location tracking.", true);
          return;
        }
        state = "running";
        startedAt = Date.now();
        if (!activityStartedAt) activityStartedAt = startedAt;
        $("activityButton").disabled = true;
        $("startButton").disabled = true;
        $("startButton").textContent = "Finding GPS…";
        $("statusText").textContent = "Finding GPS signal";
        $("statusDot").classList.add("live");
        $("finishButton").hidden = false;
        timerId = window.setInterval(updateStats, 1000);
        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (error) => {
            locationError(error);
            if (state === "running") {
              $("startButton").disabled = false;
              $("startButton").textContent = "Pause";
              $("statusText").textContent = "GPS signal unavailable";
            }
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
        );
        window.addEventListener("deviceorientation", onOrientation, true);
      };

      const onOrientation = (event) => {
        if (state !== "running" || headingSource === "gps") return;
        let compassHeading = null;
        if (Number.isFinite(event.webkitCompassHeading)) {
          compassHeading = event.webkitCompassHeading;
        } else if (Number.isFinite(event.alpha)) {
          compassHeading = 360 - event.alpha;
        }
        if (compassHeading !== null) updateHeading(compassHeading, "compass");
      };

      const pauseActivity = () => {
        if (state !== "running") return;
        elapsedBeforePause += (Date.now() - startedAt) / 1000;
        state = "paused";
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        window.clearInterval(timerId);
        window.removeEventListener("deviceorientation", onOrientation, true);
        $("startButton").disabled = false;
        $("startButton").textContent = "Resume";
        $("statusText").textContent = "Activity paused";
        $("statusDot").classList.remove("live");
        setNotice("Paused. Resume when you are ready to continue.", false);
        updateStats();
      };

      const formatDateTime = (dateValue) => {
        const date = new Date(dateValue);
        if (Number.isNaN(date.getTime())) return "Date unavailable";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(date);
      };

      const persistActivities = () => {
        try {
          localStorage.setItem(storageKey, JSON.stringify(savedActivities));
          return true;
        } catch (error) {
          setNotice("Activity is visible in this session, but could not be saved on this device. Check browser storage settings.", true);
          return false;
        }
      };

      const renderActivities = () => {
        const list = $("historyList");
        list.replaceChildren();
        $("activityHistory").hidden = false;
        if (!savedActivities.length) {
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = "No saved activities yet.";
          list.appendChild(empty);
          return;
        }

        savedActivities.forEach((activity) => {
          const item = document.createElement("article");
          item.className = "history-item";
          const top = document.createElement("div");
          top.className = "history-top";
          const details = document.createElement("div");
          const name = document.createElement("div");
          name.className = "history-name";
          name.textContent = activity.name;
          const date = document.createElement("div");
          date.className = "history-date";
          date.textContent = `${activity.type} · ${formatDateTime(activity.startedAt)} · Finished ${formatDateTime(activity.finishedAt)}`;
          details.append(name, date);
          const rename = document.createElement("button");
          rename.className = "rename-button";
          rename.type = "button";
          rename.textContent = "Rename";
          rename.setAttribute("aria-label", `Rename ${activity.name}`);
          rename.addEventListener("click", () => {
            const updatedName = window.prompt("Rename this activity", activity.name);
            if (updatedName === null) return;
            const trimmedName = updatedName.trim();
            if (!trimmedName) {
              setNotice("Activity name cannot be empty.", true);
              return;
            }
            activity.name = trimmedName;
            renderActivities();
            persistActivities();
          });
          const actions = document.createElement("div");
          actions.style.display = "flex";
          actions.style.gap = "6px";
          const view = document.createElement("button");
          view.className = "rename-button";
          view.type = "button";
          view.textContent = "View";
          view.setAttribute("aria-label", `View activity summary for ${activity.name}`);
          view.addEventListener("click", () => openActivityCard(activity));
          actions.append(view, rename);
          top.append(details, actions);

          const stats = document.createElement("div");
          stats.className = "history-stats";
          [
            `${(activity.distanceMeters / 1000).toFixed(2)} km`,
            formatTime(activity.durationSeconds),
            activity.distanceMeters >= 10 ? `${Math.floor(activity.durationSeconds / (activity.distanceMeters / 1000) / 60)}:${String(Math.floor(activity.durationSeconds / (activity.distanceMeters / 1000) % 60)).padStart(2, "0")} /km` : "— /km"
          ].forEach((value) => {
            const stat = document.createElement("span");
            stat.textContent = value;
            stats.appendChild(stat);
          });
          item.append(top, stats);
          list.appendChild(item);
        });
      };

      const loadActivities = () => {
        try {
          const stored = localStorage.getItem(storageKey);
          const parsed = stored ? JSON.parse(stored) : [];
          if (!Array.isArray(parsed)) throw new Error("Saved activity data is not a list.");
          savedActivities = parsed.filter((activity) =>
            activity && typeof activity.name === "string" &&
            typeof activity.type === "string" &&
            typeof activity.startedAt === "string" &&
            typeof activity.finishedAt === "string" &&
            Number.isFinite(activity.distanceMeters) &&
            Number.isFinite(activity.durationSeconds)
          );
          if (savedActivities.length) renderActivities();
        } catch (error) {
          setNotice("Could not read saved activities from this device. Browser storage may be unavailable or corrupted.", true);
        }
      };

      const createActivityCard = (activity) => {
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1920;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Canvas is not available.");

        context.fillStyle = "#050505";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.textAlign = "center";
        context.fillStyle = "#fff";
        context.font = "700 54px system-ui, sans-serif";
        context.fillText("Distance", 540, 245);
        context.font = "800 112px system-ui, sans-serif";
        context.fillText(`${(activity.distanceMeters / 1000).toFixed(2)} km`, 540, 365);

        context.font = "700 54px system-ui, sans-serif";
        context.fillText("Pace", 540, 625);
        context.font = "800 96px system-ui, sans-serif";
        const paceText = activity.distanceMeters >= 10
          ? `${Math.floor(activity.durationSeconds / (activity.distanceMeters / 1000) / 60)}:${String(Math.floor(activity.durationSeconds / (activity.distanceMeters / 1000) % 60)).padStart(2, "0")} /km`
          : "—:— /km";
        context.fillText(paceText, 540, 745);

        context.font = "700 54px system-ui, sans-serif";
        context.fillText("Time", 540, 990);
        context.font = "800 100px system-ui, sans-serif";
        context.fillText(formatCardTime(activity.durationSeconds), 540, 1115);

        const points = Array.isArray(activity.route)
          ? activity.route.filter((point) => Array.isArray(point) && point.length >= 2 && point.every(Number.isFinite))
          : [];
        if (points.length > 1) {
          const centerLat = points.reduce((sum, point) => sum + point[0], 0) / points.length;
          const projected = points.map(([lat, lng]) => [lng * Math.cos(centerLat * Math.PI / 180), lat]);
          const xs = projected.map((point) => point[0]);
          const ys = projected.map((point) => point[1]);
          const minX = Math.min(...xs);
          const maxX = Math.max(...xs);
          const minY = Math.min(...ys);
          const maxY = Math.max(...ys);
          const routeWidth = Math.max(maxX - minX, 0.000001);
          const routeHeight = Math.max(maxY - minY, 0.000001);
          const scale = Math.min(570 / routeWidth, 400 / routeHeight);
          const offsetX = 540 - (minX + maxX) / 2 * scale;
          const offsetY = 1425 + (minY + maxY) / 2 * scale;

          context.beginPath();
          projected.forEach(([x, y], index) => {
            const canvasX = offsetX + x * scale;
            const canvasY = offsetY - y * scale;
            if (index === 0) context.moveTo(canvasX, canvasY);
            else context.lineTo(canvasX, canvasY);
          });
          context.strokeStyle = "#fc4c02";
          context.lineWidth = 9;
          context.lineCap = "round";
          context.lineJoin = "round";
          context.stroke();
        } else {
          context.fillStyle = "#9da99e";
          context.font = "500 28px system-ui, sans-serif";
          context.fillText("No GPS route recorded", 540, 1435);
        }

        context.fillStyle = "#fff";
        context.font = "800 54px system-ui, sans-serif";
        context.fillText("LRUN", 540, 1745);
        context.fillStyle = "#a9aaa9";
        context.font = "500 26px system-ui, sans-serif";
        context.fillText(`${activity.name}  ·  ${formatDateTime(activity.startedAt)}`, 540, 1800, 900);
        return canvas.toDataURL("image/png");
      };

      let currentCardDataUrl = "";
      let currentCardName = "stride-activity";
      const openActivityCard = (activity) => {
        try {
          currentCardDataUrl = createActivityCard(activity);
          currentCardName = `stride-${activity.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "activity"}.png`;
          $("sharePreview").src = currentCardDataUrl;
          $("shareDialog").showModal();
        } catch (error) {
          setNotice("Could not create the activity image on this device.", true);
        }
      };

      const finishActivity = () => {
        if (state === "running") elapsedBeforePause += (Date.now() - startedAt) / 1000;
        state = "finished";
        if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        window.clearInterval(timerId);
        window.removeEventListener("deviceorientation", onOrientation, true);
        $("startButton").disabled = false;
        $("startButton").textContent = "New activity";
        $("activityButton").disabled = false;
        $("finishButton").hidden = true;
        $("statusText").textContent = "Activity complete";
        $("statusDot").classList.remove("live");
        const finishedAt = Date.now();
        const startedAtDate = activityStartedAt || finishedAt - elapsedBeforePause * 1000;
        const activity = {
          id: `${finishedAt}-${Math.random().toString(36).slice(2, 8)}`,
          name: `${activityType === "RUN" ? "Run" : "Walk"} · ${new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }).format(new Date(startedAtDate))}`,
          type: activityType,
          startedAt: new Date(startedAtDate).toISOString(),
          finishedAt: new Date(finishedAt).toISOString(),
          distanceMeters: totalMeters,
          durationSeconds: elapsedBeforePause,
          route: route.getLatLngs().map((point) => [point.lat, point.lng])
        };
        savedActivities.unshift(activity);
        renderActivities();
        const persisted = persistActivities();
        if (persisted) setNotice(`Activity saved · ${(totalMeters / 1000).toFixed(2)} km. Rename it in Saved activities.`, false);
        updateStats();
        openActivityCard(activity);
      };

      const resetActivity = () => {
        totalMeters = 0;
        elapsedBeforePause = 0;
        activityStartedAt = 0;
        lastPoint = null;
        latestPosition = null;
        headingSource = "";
        route.setLatLngs([]);
        if (marker) {
          map.removeLayer(marker);
          marker = null;
        }
        $("accuracy").textContent = "—";
        $("headingValue").textContent = "—°";
        $("headingHint").textContent = "Start moving to find your heading";
        $("compass").style.setProperty("--heading", "0deg");
        $("activityButton").disabled = false;
        state = "ready";
        updateStats();
        setNotice("Your location stays on this device. Allow location access to track your route.", false);
      };

      $("startButton").addEventListener("click", async () => {
        if (state === "running") {
          pauseActivity();
          return;
        }
        if (state === "finished") resetActivity();
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== "granted") setNotice("Compass access was not granted. GPS direction will still work while moving.", false);
          } catch (error) {
            setNotice("Compass access is unavailable. GPS direction will still work while moving.", false);
          }
        }
        startWatch();
      });

      $("finishButton").addEventListener("click", finishActivity);
      $("closeShareButton").addEventListener("click", () => $("shareDialog").close());
      $("downloadCardButton").addEventListener("click", () => {
        if (!currentCardDataUrl) return;
        const download = document.createElement("a");
        download.href = currentCardDataUrl;
        download.download = currentCardName;
        download.click();
      });
      $("activityButton").addEventListener("click", () => {
        activityType = activityType === "RUN" ? "WALK" : "RUN";
        $("activityButton").lastChild.textContent = activityType;
        $("activityButton").setAttribute("aria-label", `Activity type: ${activityType === "RUN" ? "Run" : "Walk"}. Tap to change`);
      });
      $("locateButton").addEventListener("click", () => {
        if (latestPosition) map.setView(latestPosition, Math.max(map.getZoom(), 16), { animate: true });
        else requestCurrentLocation();
      });

      const requestCurrentLocation = () => {
        if (!navigator.geolocation) {
          setNotice("This browser does not support GPS location. Open this page in a browser with location access.", true);
          return;
        }
        setNotice("Finding your current location…", false);
        navigator.geolocation.getCurrentPosition(
          (position) => {
            showCurrentLocation(position);
            $("statusText").textContent = "Your location";
            setNotice("Your current location is shown on the map. Start an activity when you are ready.", false);
          },
          locationError,
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
        );
      };

      loadActivities();
      updateStats();
      window.setTimeout(() => map.invalidateSize(), 100);
      requestCurrentLocation();
    })();
  </script>
</body>
</html>
